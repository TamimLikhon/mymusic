name: mymusic
description: "A retro-themed offline music player with tag-based organization."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  audio_metadata_reader: ^1.6.0
  audio_session: ^0.2.4
  drift: ^2.34.2
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  google_fonts: ^8.2.0
  hugeicons: ^1.1.7
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  provider: ^6.1.5+1
  sqlite3_flutter_libs: ^0.6.0+eol
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/silence.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"
